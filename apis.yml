name: Medwing
description: >-
  MEDWING is Germany's largest digital service platform for jobs and staffing in the
  healthcare sector, founded in 2017 and headquartered in Berlin. It operates a
  recruitment marketplace that matches hospitals, clinics and care facilities with
  nurses, caregivers, doctors, midwives, pharmacists and other healthcare
  professionals across Germany and the United Kingdom. Beyond permanent placement,
  MEDWING combines career brokerage with temporary-staffing (Zeitarbeit) operations
  and HR/workforce tooling, offering an end-to-end digital workflow that spans job
  search, matching, contracts, digital signatures and timesheets. The service is free
  for candidates, with employers paying on successful placement. MEDWING is backed by
  Northzone and other investors. This profile was enriched from public web sources;
  MEDWING does not currently publish a public developer API.
